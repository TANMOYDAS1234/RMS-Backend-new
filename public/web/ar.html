<!doctype html>
<!--
  AR / 3D Viewer page.

  Customer-facing: opened in a new tab from a menu tile in the Flutter
  Web QR ordering screen. Powered by Google's <model-viewer> — handles
  Scene Viewer (Android) and Quick Look (iOS, requires a USDZ) natively.

  Query params:
    model    = path to the GLB (default /models/pizza.glb — the demo asset)
    iosModel = path to the USDZ for iOS AR Quick Look. If omitted, we derive
               it from `model` by swapping the extension to .usdz. If the
               file doesn't exist iOS just falls back to in-page 3D — the
               drag-to-rotate experience still works either way.
    name     = item display name (shown in the title bar)
-->
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>DINE OPS — AR Preview</title>
  <script type="module"
    src="https://unpkg.com/@google/model-viewer@3.5.0/dist/model-viewer.min.js"></script>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body {
      margin: 0; padding: 0; height: 100%; overflow: hidden;
      background: radial-gradient(circle at 30% 20%, #2a1810, #0d0805 60%, #000 100%);
      color: #f3e8d8;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    header {
      position: fixed; top: 0; left: 0; right: 0; z-index: 10;
      display: flex; align-items: center; justify-content: space-between;
      padding: 14px 18px;
      background: linear-gradient(180deg, rgba(0,0,0,0.55) 0%, transparent 100%);
    }
    header h1 {
      margin: 0; font-size: 16px; font-weight: 800; letter-spacing: 0.5px;
      text-overflow: ellipsis; overflow: hidden; white-space: nowrap; max-width: 70vw;
    }
    .close {
      color: #f3e8d8; background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.12);
      width: 36px; height: 36px; border-radius: 18px;
      display: flex; align-items: center; justify-content: center;
      font-size: 20px; text-decoration: none; cursor: pointer;
    }
    model-viewer {
      width: 100vw; height: 100vh; background: transparent;
      --poster-color: transparent;
      opacity: 0; transform: scale(0.4) rotate(-360deg);
      animation: appear 1.4s cubic-bezier(0.22, 1, 0.36, 1) 0.15s forwards;
      filter: drop-shadow(0 30px 60px rgba(200, 123, 58, 0.4));
      position: relative; z-index: 2;
    }
    @keyframes appear {
      0%   { opacity: 0; transform: scale(0.3) rotate(-360deg); filter: blur(30px) brightness(0.3); }
      40%  { opacity: 1; filter: blur(6px) brightness(1.4); }
      75%  { transform: scale(1.08) rotate(8deg); filter: blur(0) brightness(1.2); }
      100% { opacity: 1; transform: scale(1) rotate(0deg); filter: blur(0) brightness(1); }
    }
    /* Drifting copper-steam blobs — three lazy-floating radial gradients. */
    .particles { position: fixed; inset: 0; pointer-events: none; z-index: 1; overflow: hidden; }
    .particles span {
      position: absolute; border-radius: 50%;
      background: radial-gradient(circle, rgba(200,123,58,0.35) 0%, rgba(200,123,58,0) 70%);
      filter: blur(6px);
      animation: drift 14s ease-in-out infinite alternate;
    }
    .particles span:nth-child(1) { width: 220px; height: 220px; top: 12%; left: 8%;  animation-delay: 0s; }
    .particles span:nth-child(2) { width: 180px; height: 180px; top: 65%; left: 75%; animation-delay: -4s; }
    .particles span:nth-child(3) { width: 140px; height: 140px; top: 78%; left: 12%; animation-delay: -8s; }
    .particles span:nth-child(4) { width: 160px; height: 160px; top: 22%; left: 70%; animation-delay: -11s; }
    @keyframes drift {
      0%   { transform: translate(0, 0) scale(1); opacity: 0.6; }
      50%  { transform: translate(40px, -30px) scale(1.2); opacity: 1; }
      100% { transform: translate(-30px, 35px) scale(0.9); opacity: 0.7; }
    }
    /* Slow-rotating conic-gradient halo behind the model. */
    .halo { position: fixed; inset: 0; pointer-events: none; z-index: 1;
            display: flex; align-items: center; justify-content: center; }
    .halo::before {
      content: ''; width: 70vmin; height: 70vmin; border-radius: 50%;
      background: conic-gradient(from 0deg,
        rgba(200,123,58,0) 0deg,
        rgba(200,123,58,0.35) 60deg,
        rgba(232, 162, 104, 0.5) 120deg,
        rgba(200,123,58,0) 180deg,
        rgba(232, 162, 104, 0.45) 280deg,
        rgba(200,123,58,0) 360deg);
      filter: blur(40px);
      animation: spin 10s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    /* Custom AR button overlay — model-viewer's default is fine, but
       we recolor it to match the dine-ops palette. */
    .ar-button {
      position: fixed; bottom: 28px; left: 50%; transform: translateX(-50%);
      background: linear-gradient(135deg, #c87b3a, #a85a20);
      color: #fff; font-weight: 800; font-size: 14px; letter-spacing: 1.5px;
      padding: 16px 28px; border-radius: 28px; border: none;
      box-shadow:
        0 10px 28px rgba(200, 123, 58, 0.45),
        0 0 0 0 rgba(200, 123, 58, 0.6);
      cursor: pointer; z-index: 5;
      display: flex; align-items: center; gap: 10px;
      /* Heartbeat pulse so the AR button reads as the primary action and
         not just decoration. */
      animation: arPulse 2.2s ease-in-out infinite;
    }
    @keyframes arPulse {
      0%, 100% {
        box-shadow:
          0 10px 28px rgba(200, 123, 58, 0.45),
          0 0 0 0 rgba(200, 123, 58, 0.6);
      }
      50% {
        box-shadow:
          0 14px 36px rgba(200, 123, 58, 0.6),
          0 0 0 12px rgba(200, 123, 58, 0);
      }
    }
    .ar-button:active {
      transform: translateX(-50%) scale(0.97);
      animation-play-state: paused;
    }
    .hint {
      position: fixed; top: 64px; left: 50%; transform: translateX(-50%);
      font-size: 12px; color: rgba(243, 232, 216, 0.7);
      background: rgba(0,0,0,0.4); padding: 6px 12px; border-radius: 12px;
      backdrop-filter: blur(8px);
      animation: fadeIn 1s ease 1.2s both;
      max-width: 80vw; text-align: center;
    }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

    /* AR install / unsupported banner — only shown when canActivateAR
       is false. Includes a deep link to Google Play Services for AR on
       Android so the customer can install it without leaving the flow,
       and a friendly note for iOS users on phones too old to upgrade. */
    .install-banner {
      position: fixed; bottom: 28px; left: 50%; transform: translateX(-50%);
      max-width: 88vw;
      background: rgba(40, 24, 16, 0.85);
      border: 1px solid rgba(200, 123, 58, 0.5);
      padding: 14px 18px; border-radius: 16px;
      color: #f3e8d8; font-size: 12px; line-height: 1.5;
      backdrop-filter: blur(10px);
      text-align: center;
      display: none;
      z-index: 6;
    }
    .install-banner.visible { display: block; }
    .install-banner a {
      display: inline-block; margin-top: 8px;
      background: linear-gradient(135deg, #c87b3a, #a85a20);
      color: #fff; text-decoration: none;
      padding: 8px 14px; border-radius: 18px;
      font-weight: 800; letter-spacing: 0.5px;
    }

    /* First-contact burst — a copper ring that radiates outward the
       moment AR session starts, signalling to the customer that the
       hand-off worked. CSS-only, fired by a class toggle in JS. */
    .burst {
      position: fixed; left: 50%; top: 50%;
      width: 12px; height: 12px;
      border-radius: 50%;
      background: rgba(200, 123, 58, 0.85);
      pointer-events: none; z-index: 8;
      opacity: 0;
    }
    .burst.fire {
      animation: burst 900ms ease-out forwards;
    }
    @keyframes burst {
      0%   { opacity: 1; transform: translate(-50%, -50%) scale(1); box-shadow: 0 0 0 0 rgba(200,123,58,0.7); }
      60%  { opacity: 0.8; box-shadow: 0 0 0 80px rgba(200,123,58,0.15); }
      100% { opacity: 0; transform: translate(-50%, -50%) scale(8); box-shadow: 0 0 0 120px rgba(200,123,58,0); }
    }
  </style>
</head>
<body>
  <header>
    <h1 id="title">3D Preview</h1>
    <a class="close" href="javascript:window.close();window.history.length>1?window.history.back():null;">×</a>
  </header>

  <div class="particles"><span></span><span></span><span></span><span></span></div>
  <div class="halo"></div>

  <div class="hint" id="hint">Drag to rotate · Pinch to zoom · Tap "View in your space"</div>

  <!-- Install / unsupported banner. Populated by JS based on the device. -->
  <div class="install-banner" id="install"></div>

  <!-- First-contact burst — animates when AR session activates. -->
  <div class="burst" id="burst"></div>

  <model-viewer
    id="mv"
    src="/models/pizza.glb"
    ios-src="/models/pizza.usdz"
    alt="3D model"
    camera-controls
    auto-rotate
    ar
    ar-modes="webxr scene-viewer quick-look"
    shadow-intensity="1.2"
    exposure="1.1"
    environment-image="neutral"
    camera-orbit="0deg 75deg 110%"
    field-of-view="30deg">
    <button slot="ar-button" class="ar-button">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
        <path d="M3 7v10l9 5 9-5V7l-9-5-9 5z" />
        <path d="M3 7l9 5 9-5" />
        <path d="M12 12v10" />
      </svg>
      VIEW IN YOUR SPACE
    </button>
  </model-viewer>

  <script>
    // Resolve params and apply.
    const params = new URLSearchParams(window.location.search);
    const model = params.get('model') || '/models/pizza.glb';
    // If the caller doesn't pass an iOS-specific URL, derive one by
    // swapping .glb → .usdz on the same path. Apple's AR Quick Look
    // requires USDZ; if the file isn't there the AR button just
    // gracefully degrades to in-page 3D on iPhones.
    const iosModel = params.get('iosModel') ||
                     model.replace(/\.(glb|gltf)$/i, '.usdz');
    const name = params.get('name') || '3D Preview';
    document.getElementById('title').textContent = name;
    const mv = document.getElementById('mv');
    mv.setAttribute('src', model);
    mv.setAttribute('ios-src', iosModel);
    // Slight extra entrance kick once the model is loaded.
    mv.addEventListener('load', () => {
      mv.style.animation = 'none';
      // Force reflow then re-apply the entrance for the loaded geometry.
      void mv.offsetWidth;
      mv.style.animation = 'appear 0.9s cubic-bezier(0.22, 1, 0.36, 1) forwards';
    });

    // model-viewer flips canActivateAR=true once Scene Viewer / Quick
    // Look is reachable. Use that to refine the copy + surface an
    // install path on phones where AR isn't yet available.
    customElements.whenDefined('model-viewer').then(() => {
      setTimeout(() => {
        const hint = document.getElementById('hint');
        const install = document.getElementById('install');
        const arBtn = document.querySelector('.ar-button');
        if (!hint || !install) return;

        if (mv.canActivateAR) {
          hint.textContent = 'AR ready — point your camera at the table after tapping the button below';
          return;
        }

        // Not AR-capable today. Refine the message + give the user a
        // real next step where one exists.
        hint.textContent = 'Drag to rotate · Pinch to zoom';
        if (arBtn) arBtn.style.display = 'none';

        // Detect platform for the install pitch.
        const ua = navigator.userAgent || '';
        const isAndroid = /Android/i.test(ua);
        const isIOS = /iPad|iPhone|iPod/i.test(ua);

        if (isAndroid) {
          install.innerHTML =
            'AR not available on this phone yet.<br/>' +
            'Install Google Play Services for AR to unlock the back-camera preview.' +
            '<br/><a href="https://play.google.com/store/apps/details?id=com.google.ar.core" target="_blank" rel="noopener">Install ARCore</a>';
          install.classList.add('visible');
        } else if (isIOS) {
          install.innerHTML =
            'AR Quick Look needs iOS 11 or later on an iPhone 6s and newer.<br/>' +
            'Update your iPhone (or open this page on a newer device) to view in your space.';
          install.classList.add('visible');
        } else {
          install.innerHTML =
            'Your device does not support augmented reality.<br/>' +
            'Open this page on a recent Android or iPhone to point the camera at your table.';
          install.classList.add('visible');
        }
      }, 200);
    });

    // Hide the in-page "drag to rotate" hint the moment the customer
    // hands off to native AR — Scene Viewer/Quick Look take over the
    // viewport and the hint becomes visual noise floating above their
    // own controls. Also fire the first-contact burst the same moment
    // so the hand-off feels punctuated rather than silent.
    mv.addEventListener('ar-status', (e) => {
      const hint = document.querySelector('.hint');
      const halo = document.querySelector('.halo');
      const particles = document.querySelector('.particles');
      const burst = document.getElementById('burst');
      if (!hint) return;
      const inAR = e.detail.status === 'session-started';
      const fade = inAR ? '0' : '1';
      hint.style.opacity = fade;
      if (halo) halo.style.opacity = fade;
      if (particles) particles.style.opacity = fade;
      if (inAR && burst) {
        // Restart the animation each time by toggling the class.
        burst.classList.remove('fire');
        // Force reflow so re-adding the class fires the keyframes.
        void burst.offsetWidth;
        burst.classList.add('fire');
      }
    });
  </script>
</body>
</html>
